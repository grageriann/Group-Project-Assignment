<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join the Team | G06 Agency</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      legend {
        font-size: 1.2rem;
        color: #1a73e8;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="jobs.html">Jobs</a></li>
          <li><a href="apply.html">Apply</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 style="text-align: center">Application for Creative Roles</h1>
      <form
        action="https://mercury.swin.edu.au/it000000/formtest.php"
        method="post"
      >
        <fieldset>
          <legend>Position Details</legend>
          <label for="job_ref">Job Reference Number:</label>
          <input
            type="text"
            id="job_ref"
            name="job_ref"
            pattern="[A-Za-z0-9]{5}"
            required
            title="5 alphanumeric characters"
          />
        </fieldset>

        <fieldset>
          <legend>Personal Profile</legend>
          <label for="first_name">First Name:</label>
          <input
            type="text"
            id="first_name"
            name="first_name"
            maxlength="20"
            pattern="[A-Za-z]+"
            required
          />

          <label for="last_name">Last Name:</label>
          <input
            type="text"
            id="last_name"
            name="last_name"
            maxlength="20"
            pattern="[A-Za-z]+"
            required
          />

          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob" required />

          <p>Gender Identity:</p>
          <label
            ><input type="radio" name="gender" value="male" required />
            Male</label
          >
          <label
            ><input type="radio" name="gender" value="female" /> Female</label
          >
          <label
            ><input type="radio" name="gender" value="other" /> Other</label
          >
        </fieldset>

        <fieldset>
          <legend>Contact & Address</legend>
          <label for="street">Street Address:</label>
          <input
            type="text"
            id="street"
            name="street"
            maxlength="40"
            required
          />

          <label for="suburb">Suburb/Town:</label>
          <input
            type="text"
            id="suburb"
            name="suburb"
            maxlength="40"
            required
          />

          <label for="state">State:</label>
          <select id="state" name="state" required>
            <option value="">Select State</option>
            <option value="VIC">VIC</option>
            <option value="NSW">NSW</option>
            <option value="QLD">QLD</option>
            <option value="NT">NT</option>
            <option value="WA">WA</option>
            <option value="SA">SA</option>
            <option value="TAS">TAS</option>
            <option value="ACT">ACT</option>
          </select>

          <label for="postcode">Postcode:</label>
          <input
            type="text"
            id="postcode"
            name="postcode"
            pattern="\d{4}"
            required
            title="4 digits"
          />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <label for="phone">Phone:</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            pattern="\d{8,12}"
            required
            title="8-12 digits"
          />
        </fieldset>

        <fieldset>
          <legend>Technical Expertise</legend>
          <label
            ><input type="checkbox" name="skills[]" value="HTML" />
            HTML/CSS</label
          >
          <label
            ><input type="checkbox" name="skills[]" value="JS" />
            JavaScript</label
          >
          <label
            ><input type="checkbox" name="skills[]" value="UX" /> UI/UX
            Design</label
          >

          <label for="other_skills"
            >Other Skills (Software, Portfolio links):</label
          >
          <textarea id="other_skills" name="other_skills" rows="4"></textarea>
        </fieldset>

        <input
          type="submit"
          value="Submit Application"
          style="
            background: #1a73e8;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
          "
        />
      </form>
    </main>
  </body>
</html>
