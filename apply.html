<main>
  <h1>Job Application</h1>
  <form
    action="https://mercury.swin.edu.au/it000000/formtest.php"
    method="post"
  >
    <fieldset>
      <legend>Job Details</legend>
      <label for="job_ref">Job Reference Number:</label>
      <input
        type="text"
        id="job_ref"
        name="job_ref"
        pattern="[A-Za-z0-9]{5}"
        required
        title="Exactly 5 alphanumeric characters"
      />
    </fieldset>

    <fieldset>
      <legend>Personal Details</legend>
      <label for="first_name">First Name:</label>
      <input
        type="text"
        id="first_name"
        name="first_name"
        maxlength="20"
        pattern="[A-Za-z]+"
        required
      />

      <label for="last_name">Last Name:</label>
      <input
        type="text"
        id="last_name"
        name="last_name"
        maxlength="20"
        pattern="[A-Za-z]+"
        required
      />

      <label for="dob">Date of Birth:</label>
      <input
        type="date"
        id="dob"
        name="dob"
        required
        placeholder="dd/mm/yyyy"
      />

      <p>Gender:</p>
      <label
        ><input type="radio" name="gender" value="male" required /> Male</label
      >
      <label><input type="radio" name="gender" value="female" /> Female</label>
      <label><input type="radio" name="gender" value="other" /> Other</label>
    </fieldset>

    <fieldset>
      <legend>Address</legend>
      <label for="street">Street Address:</label>
      <input type="text" id="street" name="street" maxlength="40" required />

      <label for="suburb">Suburb/Town:</label>
      <input type="text" id="suburb" name="suburb" maxlength="40" required />

      <label for="state">State:</label>
      <select id="state" name="state" required>
        <option value="">Select State</option>
        <option value="VIC">VIC</option>
        <option value="NSW">NSW</option>
        <option value="QLD">QLD</option>
        <option value="NT">NT</option>
        <option value="WA">WA</option>
        <option value="SA">SA</option>
        <option value="TAS">TAS</option>
        <option value="ACT">ACT</option>
      </select>

      <label for="postcode">Postcode:</label>
      <input
        type="text"
        id="postcode"
        name="postcode"
        pattern="\d{4}"
        required
        title="Exactly 4 digits"
      />
    </fieldset>

    <fieldset>
      <legend>Contact Information</legend>
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required />

      <label for="phone">Phone Number:</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        pattern="\d{8,12}"
        required
        title="Between 8 and 12 digits"
      />
    </fieldset>

    <fieldset>
      <legend>Skills</legend>
      <p>Select your skills:</p>
      <label><input type="checkbox" name="skills[]" value="HTML" /> HTML</label>
      <label><input type="checkbox" name="skills[]" value="CSS" /> CSS</label>
      <label
        ><input type="checkbox" name="skills[]" value="Design" /> UI/UX
        Design</label
      >

      <label for="other_skills">Other Skills:</label>
      <textarea
        id="other_skills"
        name="other_skills"
        rows="4"
        cols="50"
        placeholder="List any other relevant experience..."
      ></textarea>
    </fieldset>

    <input type="submit" value="Apply" />
  </form>
</main>
